services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grandmaster
      POSTGRES_PASSWORD: grandmaster
      POSTGRES_DB: grandmaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grandmaster -d grandmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["bun", "migrate.ts"]
    environment:
      DATABASE_URL: postgresql://grandmaster:grandmaster@postgres:5432/grandmaster
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://grandmaster:grandmaster@postgres:5432/grandmaster
      JWT_SECRET: ${JWT_SECRET:-trocar-em-producao}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:19000,http://localhost:8081,http://localhost:8082}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
